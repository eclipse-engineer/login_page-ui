<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login Page</title>
   <style>
      body {
         background-color: #1a1a1a;
         margin: 0;
         padding: 0;
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
      }
      form {
         background-color: gray;
         border-radius: 8px;
         padding: 40px;
         display: flex;
         flex-direction: column;
         gap: 10px;
      }
      h1 {
         color: darkblue;
         text-align: center;
         margin: 0;
      }
      .card {
         display: flex;
         justify-content: center;
         text-align: center;
         width: 300px;
      }
      input {
         margin-bottom: 10px;
         padding: 15px;
         border-radius: 5px;
         border: 1px solid black;
      }
      button {
         background-color: #1b81da;
         color: white;
         padding: 12px;
         border: none;
         border-radius: 5px;
         cursor: pointer;
      }
      button:hover {
         background-color: blue;
      }
   </style>
</head>
<body>
   <div class="card">
      <form>
         <h1>LOGIN</h1>
         <input type="email" placeholder="Email" required>
         <input type="password" placeholder="Password" required>
         <button type="submit">LOGIN</button>
      </form>
   </div>
</body>
</html>
